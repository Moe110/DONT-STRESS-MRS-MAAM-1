<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arwa's Big Full House</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0a10;
            color: #f3f0ea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            height: 440px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 3px solid #3d364a;
            overflow: hidden;
            background-color: #1a1625;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .control-btn {
            background: rgba(45, 38, 59, 0.85);
            color: #f3f0ea;
            border: 2px solid #7c3aed;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:hover {
            background: rgba(107, 83, 130, 0.9);
        }

        .dpad-container {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(2, 40px);
            gap: 4px;
            z-index: 10;
        }

        .dpad-btn {
            background: rgba(45, 38, 59, 0.9);
            color: #f3f0ea;
            border: 2px solid #7c3aed;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .dpad-btn:active {
            background: #7c3aed;
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }

        .message-box {
            margin-top: 12px;
            width: 100%;
            max-width: 560px;
            min-height: 80px;
            background: #2d263b;
            border: 2px solid #5d5070;
            border-radius: 14px;
            padding: 12px 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .message-box p {
            font-size: 13px;
            line-height: 1.4;
            color: #e2e8f0;
            transition: opacity 0.15s ease;
        }

        .action-prompt {
            margin-top: 6px;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hint {
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div class="controls-bar">
            <button class="control-btn" onclick="toggleLights()" id="light-btn">💡 lights off</button>
            <button class="control-btn" onclick="resetPosition()">🏠 center map</button>
        </div>

        <div class="dpad-container">
            <button class="dpad-btn dpad-up" ontouchstart="startMove('w')" ontouchend="stopMove('w')" onmousedown="startMove('w')" onmouseup="stopMove('w')">⬆️</button>
            <button class="dpad-btn dpad-left" ontouchstart="startMove('a')" ontouchend="stopMove('a')" onmousedown="startMove('a')" onmouseup="stopMove('a')">⬅️</button>
            <button class="dpad-btn dpad-down" ontouchstart="startMove('s')" ontouchend="stopMove('s')" onmousedown="startMove('s')" onmouseup="stopMove('s')">⬇️</button>
            <button class="dpad-btn dpad-right" ontouchstart="startMove('d')" ontouchend="stopMove('d')" onmousedown="startMove('d')" onmouseup="stopMove('d')">➡️</button>
        </div>
    </div>

    <div class="message-box">
        <p id="main-text">walk around this big full house with multiple rooms and find all the hidden pets cuteeee arwa</p>
        <button id="interact-prompt" class="action-prompt" onclick="interactWithNearbyPet()">pet the animal</button>
    </div>
    <div class="hint">✨ explore all rooms using WASD or on screen arrows cuteeee ✨</div>

    <script>
        let scene, camera, renderer;
        let ambientLight, directionalLight;
        let lightsOn = true;

        // Character variables
        let characterGroup;
        let charPosition = { x: 0, z: 0 };
        let charRotation = 0;
        const charSpeed = 0.06;
        const keys = { w: false, a: false, s: false, d: false };

        // Big house map boundaries & interior room walls for collision
        const worldBounds = { minX: -8.7, maxX: 8.7, minZ: -8.7, maxZ: 8.7 };
        
        // Walls list for collision detection [minX, maxX, minZ, maxZ]
        const interiorWalls = [
            // Center vertical dividing wall with a doorway gap
            { minX: -0.3, maxX: 0.3, minZ: -5, maxZ: -1.5 },
            { minX: -0.3, maxX: 0.3, minZ: 1.5, maxZ: 5 },
            // Horizontal dividing wall between front and back rooms with a doorway gap
            { minX: -5, maxX: -1.5, minZ: -0.3, maxZ: 0.3 },
            { minX: 1.5, maxX: 5, minZ: -0.3, maxZ: 0.3 }
        ];

        // Pets scattered across multiple rooms
        const pets = [
            { x: -6.5, z: -6.5, type: 'dog', name: 'goldie', emoji: '🐶', room: 'bedroom', msg: "goldie wags its fluffy tail so happily cuteeee" },
            { x: 6.5, z: -6.5, type: 'cat', name: 'luna', emoji: '🐱', room: 'office', msg: "luna purrs and rubs right against your ankle cuteeee" },
            { x: -6.5, z: 6.5, type: 'bird', name: 'chirpy', emoji: '🐦', room: 'kitchen', msg: "chirpy sings a cheerful morning melody cuteeee" },
            { x: 6.5, z: 6.5, type: 'bunny', name: 'hop', emoji: '🐰', room: 'lounge', msg: "hop does a cute little bounce on the plush carpet cuteeee" },
            { x: 0, z: -7.2, type: 'hamster', name: 'nugget', emoji: '🐹', room: 'hallway', msg: "nugget stuffs its cheeks with tiny snacks cuteeee" }
        ];
        let activeNearbyPet = null;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfbf9);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.68);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xfffaed, 0.95);
            directionalLight.position.set(10, 15, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 5. Build Big Multi-Room House
            buildBigHouse();

            // 6. Build Character
            buildCharacter();

            // 7. Build Pets
            buildPets();

            // 8. Event listeners
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            window.addEventListener('resize', onWindowResize, false);
        }

        function buildBigHouse() {
            // Big wooden floor covering all rooms
            const floorGeo = new THREE.PlaneGeometry(18, 18);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 0.75 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Outer House Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf3f0ea, roughness: 0.9 });
            
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(18, 5, 0.4), wallMat);
            backWall.position.set(0, 2.5, -9);
            backWall.receiveShadow = true;
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(18, 5, 0.4), wallMat);
            frontWall.position.set(0, 2.5, 9);
            frontWall.receiveShadow = true;
            scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 18), wallMat);
            leftWall.position.set(-9, 2.5, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 18), wallMat);
            rightWall.position.set(9, 2.5, 0);
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Interior walls dividing multiple rooms
            const partitionMat = new THREE.MeshStandardMaterial({ color: 0xe6e0d5, roughness: 0.8 });
            
            // Vertical partitions with gaps for doorways
            const vWall1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 4.5), partitionMat);
            vWall1.position.set(0, 2.5, -6.5);
            scene.add(vWall1);

            const vWall2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 4.5), partitionMat);
            vWall2.position.set(0, 2.5, 6.5);
            scene.add(vWall2);

            // Horizontal partitions
            const hWall1 = new THREE.Mesh(new THREE.BoxGeometry(4.5, 5, 0.3), partitionMat);
            hWall1.position.set(-6.5, 2.5, 0);
            scene.add(hWall1);

            const hWall2 = new THREE.Mesh(new THREE.BoxGeometry(4.5, 5, 0.3), partitionMat);
            hWall2.position.set(6.5, 2.5, 0);
            scene.add(hWall2);

            // --- DECOR & CARPETS IN ROOMS ---
            // Bedroom Carpets & Bed
            const bed = new THREE.Group();
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0xf472b6 }));
            mattress.position.set(0, 0.2, 0);
            bed.add(mattress);
            bed.position.set(-6.5, 0, -6.5);
            scene.add(bed);

            // Living Room Rug
            const rugGeo = new THREE.PlaneGeometry(4, 3.5);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.9 });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(5, 0.01, 5);
            scene.add(rug);

            // Office Desk
            const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x4a3b5c }));
            desk.position.set(6.5, 1.0, -6.5);
            scene.add(desk);
        }

        function buildCharacter() {
            characterGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.6 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), bodyMat);
            body.position.set(0, 0.55, 0);
            body.castShadow = true;
            characterGroup.add(body);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.7 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), headMat);
            head.position.set(0, 1.05, 0);
            head.castShadow = true;
            characterGroup.add(head);

            const crownMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const crown = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 24), crownMat);
            crown.rotation.x = Math.PI / 2;
            crown.position.set(0, 1.22, 0);
            characterGroup.add(crown);

            characterGroup.position.set(charPosition.x, 0, charPosition.z);
            scene.add(characterGroup);
        }

        function buildPets() {
            pets.forEach(p => {
                const petGroup = new THREE.Group();
                const col = p.type === 'dog' ? 0xd97706 : p.type === 'cat' ? 0x94a3b8 : p.type === 'bird' ? 0x38bdf8 : p.type === 'bunny' ? 0xf472b6 : 0xfbbf24;
                const meshMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
                
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), meshMat);
                body.position.set(0, 0.25, 0);
                body.castShadow = true;
                petGroup.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), meshMat);
                head.position.set(0, 0.52, 0.1);
                head.castShadow = true;
                petGroup.add(head);

                petGroup.position.set(p.x, 0, p.z);
                p.threeObj = petGroup;
                scene.add(petGroup);
            });
        }

        function handleKey(e, isDown) {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = isDown;
            if (k === 'a' || k === 'arrowleft') keys.a = isDown;
            if (k === 's' || k === 'arrowdown') keys.s = isDown;
            if (k === 'd' || k === 'arrowright') keys.d = isDown;
        }

        function startMove(dir) { keys[dir] = true; }
        function stopMove(dir) { keys[dir] = false; }

        function toggleLights() {
            playSound(400, 300);
            lightsOn = !lightsOn;
            const btn = document.getElementById('light-btn');
            const textElement = document.getElementById('main-text');

            if (lightsOn) {
                scene.background.setHex(0xfcfbf9);
                ambientLight.intensity = 0.68;
                directionalLight.intensity = 0.95;
                btn.innerText = "💡 lights off";
                textElement.innerText = "lights are back on cozy house brightness restored cuteeee";
            } else {
                scene.background.setHex(0x0e0c14);
                ambientLight.intensity = 0.15;
                directionalLight.intensity = 0.2;
                btn.innerText = "💡 lights on";
                textElement.innerText = "lights are off nighttime house vibe is so peaceful cuteeee";
            }
        }

        function resetPosition() {
            playSound(500, 600);
            charPosition.x = 0;
            charPosition.z = 0;
            document.getElementById('main-text').innerText = "returned to the center hallway cuteeee";
        }

        function playSound(f1, f2) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(f1, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function interactWithNearbyPet() {
            if (!activeNearbyPet) return;
            playSound(600, 900);
            const textElement = document.getElementById('main-text');
            textElement.innerText = `${activeNearbyPet.emoji} ${activeNearbyPet.msg}`;
        }

        function checkCollision(x, z) {
            // Check outer boundaries
            if (x < worldBounds.minX || x > worldBounds.maxX || z < worldBounds.minZ || z > worldBounds.maxZ) {
                return true;
            }
            // Check interior walls
            for (let w of interiorWalls) {
                if (x >= w.minX && x <= w.maxX && z >= w.minZ && z <= w.maxZ) {
                    return true;
                }
            }
            return false;
        }

        function updateGame() {
            let moved = false;
            let dx = 0, dz = 0;

            if (keys.w) { dz -= charSpeed; moved = true; }
            if (keys.s) { dz += charSpeed; moved = true; }
            if (keys.a) { dx -= charSpeed; moved = true; }
            if (keys.d) { dx += charSpeed; moved = true; }

            if (moved) {
                let newX = charPosition.x + dx;
                let newZ = charPosition.z + dz;

                // Slide collisions separately for smooth movement along walls
                if (!checkCollision(newX, charPosition.z)) {
                    charPosition.x = newX;
                }
                if (!checkCollision(charPosition.x, newZ)) {
                    charPosition.z = newZ;
                }

                charRotation = Math.atan2(dx, dz);
                characterGroup.rotation.y = charRotation;
            }

            characterGroup.position.set(charPosition.x, 0, charPosition.z);

            // Smooth camera follow
            const targetCamX = charPosition.x - Math.sin(charRotation) * 4.5;
            const targetCamZ = charPosition.z - Math.cos(charRotation) * 4.5;
            
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (3.8 - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.lookAt(charPosition.x, charPosition.y + 0.8, charPosition.z);

            // Check distance to pets
            let nearest = null;
            let minDist = 1.4;

            pets.forEach(p => {
                const dist = Math.hypot(charPosition.x - p.x, charPosition.z - p.z);
                if (dist < minDist) {
                    nearest = p;
                }
            });

            const promptBtn = document.getElementById('interact-prompt');
            if (nearest) {
                activeNearbyPet = nearest;
                promptBtn.style.display = 'inline-block';
                promptBtn.innerText = `pet ${nearest.name} ${nearest.emoji} cuteeee`;
            } else {
                activeNearbyPet = null;
                promptBtn.style.display = 'none';
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
