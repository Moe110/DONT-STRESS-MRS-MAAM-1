<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arwa's 3D Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0a10;
            color: #f3f0ea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 480px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 3px solid #3d364a;
            overflow: hidden;
            background-color: #1a1625;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .control-btn {
            background: rgba(45, 38, 59, 0.85);
            color: #f3f0ea;
            border: 2px solid #7c3aed;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:hover {
            background: rgba(107, 83, 130, 0.9);
        }

        .message-box {
            margin-top: 15px;
            width: 100%;
            max-width: 480px;
            min-height: 95px;
            background: #2d263b;
            border: 2px solid #5d5070;
            border-radius: 14px;
            padding: 14px 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .message-box p {
            font-size: 13.5px;
            line-height: 1.5;
            color: #e2e8f0;
            transition: opacity 0.15s ease;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }

        .nav-btn {
            background: #4a3b5c;
            color: #f3f0ea;
            border: 1px solid #7c3aed;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }

        .hint {
            margin-top: 8px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div class="controls-bar">
            <button class="control-btn" onclick="toggleLights()" id="light-btn">💡 Turn Off Lights</button>
            <button class="control-btn" onclick="switchPet()">🐶 Switch Pet</button>
        </div>
    </div>

    <div class="message-box">
        <p id="main-text">Welcome to your full 3D room, Arwa! Drag to rotate, tap the bed, click the PC monitor to read messages, or tap your pet.</p>
        <div class="nav-buttons" id="nav-container">
            <button class="nav-btn" id="prev-btn" onclick="prevMessage()">◀ Prev</button>
            <button class="nav-btn" id="next-btn" onclick="nextMessage()">Next ▶</button>
        </div>
    </div>
    <div class="hint">✨ Touch & drag to look around 3D space ✨</div>

    <script>
        let scene, camera, renderer;
        let ambientLight, directionalLight;
        let lightsOn = true;

        // Interactive meshes
        let bedGroup, pcMonitorMesh, petMesh;
        let petTypeIndex = 0;
        const petTypes = ['dog', 'cat', 'bird', 'bunny'];
        const petEmojis = ['🐶', '🐱', '🐦', '🐰'];
        const petNames = ['Doggo', 'Kitty', 'Birdie', 'Bunny'];

        let viewingComputer = false;
        let currentMessageIndex = 0;

        const computerMessages = [
            "At least in computer science, if your code fails you just hit Ctrl+Z instead of accidentally ending up in a malpractice lawsuit.",
            "Arwa, you actually have full control over your sanity here. No gross anatomy labs at 8 AM, just pure logic and your own setup.",
            "Think about how cool it is that you can build literally anything you imagine from a laptop screen. You are setting yourself up for an amazing future.",
            "Two weeks into faculty life is always chaotic. Everything is new, everyone looks lost, and you are just trying to figure out where your lectures are. Give yourself permission to not have it all figured out right now.",
            "You survived Thanaweya Amma. Let that sink in. You went through the ultimate Egyptian academic gauntlet and came out on top, so this new chapter is entirely manageable for you.",
            "Choosing computer science over med school was not backing down from a challenge. It was a smart, conscious choice to protect your mental health and your future. Be proud of that."
        ];

        // Orbit Control variables for touch/mouse drag
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0.3;
        let cameraAngleY = 0.8;
        let cameraRadius = 8.5;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfbf9);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            updateCameraPosition();

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            directionalLight.position.set(4, 7, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 5. Build Room Environment
            buildRoom();

            // 6. Event Listeners for Interaction & Orbit
            renderer.domElement.addEventListener('pointerdown', onPointerDown, false);
            renderer.domElement.addEventListener('pointermove', onPointerMove, false);
            renderer.domElement.addEventListener('pointerup', onPointerUp, false);
            renderer.domElement.addEventListener('click', onClick, false);

            window.addEventListener('resize', onWindowResize, false);
        }

        function updateCameraPosition() {
            camera.position.x = cameraRadius * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            camera.position.y = cameraRadius * Math.sin(cameraAngleX) + 1.2;
            camera.position.z = cameraRadius * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
            camera.lookAt(0, 1.2, 0);
        }

        function buildRoom() {
            // Walls (Back and Left)
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xfcfbf9, roughness: 0.9 });
            
            const backWallGeo = new THREE.BoxGeometry(8, 6, 0.2);
            const backWall = new THREE.Mesh(backWallGeo, wallMaterial);
            backWall.position.set(0, 3, -4);
            backWall.receiveShadow = true;
            scene.add(backWall);

            const leftWallGeo = new THREE.BoxGeometry(0.2, 6, 8);
            const leftWall = new THREE.Mesh(leftWallGeo, wallMaterial);
            leftWall.position.set(-4, 3, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // Wooden Floor
            const floorGeo = new THREE.PlaneGeometry(8, 8);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x9c6b43, roughness: 0.7 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // --- BED (with Pink & White Sheets) ---
            bedGroup = new THREE.Group();
            bedGroup.userData = { type: 'bed' };

            // Bed Frame & Mattress
            const mattressGeo = new THREE.BoxGeometry(2.2, 0.5, 3.2);
            const mattressMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.8 }); // Pink
            const mattress = new THREE.Mesh(mattressGeo, mattressMat);
            mattress.position.set(0, 0.25, 0);
            mattress.castShadow = true;
            mattress.receiveShadow = true;
            bedGroup.add(mattress);

            // White Sheets/Blanket cover
            const blanketGeo = new THREE.BoxGeometry(2.0, 0.52, 2.2);
            const blanketMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }); // White
            const blanket = new THREE.Mesh(blanketGeo, blanketMat);
            blanket.position.set(0, 0.28, 0.5);
            blanket.castShadow = true;
            bedGroup.add(blanket);

            // Pillows
            const pillowGeo = new THREE.BoxGeometry(0.8, 0.2, 0.6);
            const pillowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
            const pillow1 = new THREE.Mesh(pillowGeo, pillowMat);
            pillow1.position.set(-0.5, 0.55, -1.1);
            pillow1.castShadow = true;
            bedGroup.add(pillow1);

            const pillow2 = new THREE.Mesh(pillowGeo, pillowMat);
            pillow2.position.set(0.5, 0.55, -1.1);
            pillow2.castShadow = true;
            bedGroup.add(pillow2);

            bedGroup.position.set(-2.2, 0, -1.8);
            scene.add(bedGroup);

            // --- DESK & PC MONITOR SETUP ---
            const deskGroup = new THREE.Group();

            // Desk Top
            const deskTopGeo = new THREE.BoxGeometry(2.6, 0.1, 1.3);
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.6 });
            const deskTop = new THREE.Mesh(deskTopGeo, deskMat);
            deskTop.position.set(0, 1.1, 0);
            deskTop.castShadow = true;
            deskTop.receiveShadow = true;
            deskGroup.add(deskTop);

            // Desk Legs
            const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.1);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            [-1.15, 1.15].forEach(x => {
                [-0.5, 0.5].forEach(z => {
                    const leg = new THREE.Mesh(legGeo, legMat);
                    leg.position.set(x, 0.55, z);
                    leg.castShadow = true;
                    deskGroup.add(leg);
                });
            });

            // PC Monitor (Interactive)
            pcMonitorMesh = new THREE.Group();
            pcMonitorMesh.userData = { type: 'pc' };

            const standGeo = new THREE.BoxGeometry(0.2, 0.3, 0.2);
            const standMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const stand = new THREE.Mesh(standGeo, standMat);
            stand.position.set(0, 1.25, 0);
            pcMonitorMesh.add(stand);

            const monitorBodyGeo = new THREE.BoxGeometry(1.2, 0.8, 0.1);
            const monitorBodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const monitorBody = new THREE.Mesh(monitorBodyGeo, monitorBodyMat);
            monitorBody.position.set(0, 1.75, 0);
            pcMonitorMesh.add(monitorBody);

            // Monitor Screen Text / Color
            const screenGeo = new THREE.PlaneGeometry(1.05, 0.68);
            const screenMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 1.75, 0.06);
            pcMonitorMesh.add(screen);

            deskGroup.add(pcMonitorMesh);
            deskGroup.position.set(1.5, 0, -1.8);
            scene.add(deskGroup);

            // --- PET ---
            spawnPet();
        }

        function spawnPet() {
            if (petMesh) scene.remove(petMesh);

            petMesh = new THREE.Group();
            petMesh.userData = { type: 'pet' };

            // Cute stylized low-poly pet representation
            const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: petTypeIndex === 0 ? 0xd97706 : petTypeIndex === 1 ? 0x94a3b8 : petTypeIndex === 2 ? 0x38bdf8 : 0xf472b6, roughness: 0.7 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 0.35, 0);
            body.castShadow = true;
            petMesh.add(body);

            const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 0.7, 0.15);
            head.castShadow = true;
            petMesh.add(head);

            petMesh.position.set(0.8, 0, 0.5);
            scene.add(petMesh);
        }

        // --- Interaction & Controls ---
        function playSound(freq1, freq2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function toggleLights() {
            playSound(400, 300);
            lightsOn = !lightsOn;
            const btn = document.getElementById('light-btn');
            const textElement = document.getElementById('main-text');

            if (lightsOn) {
                scene.background.setHex(0xfcfbf9);
                ambientLight.intensity = 0.65;
                directionalLight.intensity = 0.9;
                btn.innerText = "💡 Turn Off Lights";
                textElement.innerText = "Lights are back on! Room is bright and cozy.";
            } else {
                scene.background.setHex(0x0e0c14);
                ambientLight.intensity = 0.15;
                directionalLight.intensity = 0.2;
                btn.innerText = "💡 Turn On Lights";
                textElement.innerText = "Lights are off. Enjoy the calm, relaxing nighttime ambiance.";
            }
            hideNav();
        }

        function switchPet() {
            playSound(500, 700);
            petTypeIndex = (petTypeIndex + 1) % petTypes.length;
            spawnPet();
            const textElement = document.getElementById('main-text');
            textElement.innerText = `Say hello to your cute little ${petNames[petTypeIndex]} (${petEmojis[petTypeIndex]})! Tap it to play.`;
            hideNav();
        }

        function interactPet() {
            playSound(600, 900);
            const textElement = document.getElementById('main-text');
            const pet = petNames[petTypeIndex];
            
            let noise = "Woof woof!";
            if(pet === 'Kitty') noise = "Purrrr meow~";
            if(pet === 'Birdie') noise = "Chirp chirp! YOU GOT THIS ARWA!";
            if(pet === 'Bunny') noise = "Boop! Soft hops!";

            textElement.innerText = `${petEmojis[petTypeIndex]} ${noise} Your furry little companion is keeping you company in 3D!`;
            hideNav();
        }

        function interactBed() {
            playSound(350, 450);
            const textElement = document.getElementById('main-text');
            textElement.innerText = "Arwa, a completely made, cozy pink and white bed is waiting for you whenever you need to rest and reset your mind.";
            hideNav();
        }

        function openComputer() {
            playSound(500, 800);
            viewingComputer = true;
            currentMessageIndex = 0;
            updateComputerDisplay();
            document.getElementById('nav-container').style.display = 'flex';
            document.getElementById('prev-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function updateComputerDisplay() {
            const textElement = document.getElementById('main-text');
            textElement.style.opacity = 0;
            setTimeout(() => {
                textElement.innerText = `[PC Screen - Message ${currentMessageIndex + 1}/${computerMessages.length}]\n\n"${computerMessages[currentMessageIndex]}"`;
                textElement.style.opacity = 1;
            }, 100);
        }

        function nextMessage() {
            playSound(700, 850);
            currentMessageIndex = (currentMessageIndex + 1) % computerMessages.length;
            updateComputerDisplay();
        }

        function prevMessage() {
            playSound(850, 700);
            currentMessageIndex = (currentMessageIndex - 1 + computerMessages.length) % computerMessages.length;
            updateComputerDisplay();
        }

        function hideNav() {
            viewingComputer = false;
            document.getElementById('nav-container').style.display = 'none';
        }

        // --- Raycasting for 3D Object clicks ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            // Only trigger if it wasn't a drag
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // Traverse up to find group with userData
                while (obj && !obj.userData.type && obj.parent) {
                    obj = obj.parent;
                }

                if (obj && obj.userData.type) {
                    if (obj.userData.type === 'bed') interactBed();
                    else if (obj.userData.type === 'pc') openComputer();
                    else if (obj.userData.type === 'pet') interactPet();
                }
            }
        }

        // --- Orbit controls for touch and mouse drag ---
        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            cameraAngleY -= deltaX * 0.008;
            cameraAngleX += deltaY * 0.008;

            // Clamp vertical angle to keep room upright
            cameraAngleX = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraAngleX));

            updateCameraPosition();

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
