<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arwa's 3D Whole House</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0a10;
            color: #f3f0ea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 460px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 3px solid #3d364a;
            overflow: hidden;
            background-color: #1a1625;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: rgba(45, 38, 59, 0.85);
            color: #f3f0ea;
            border: 2px solid #7c3aed;
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 10.5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:hover {
            background: rgba(107, 83, 130, 0.9);
        }

        .dpad-container {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: grid;
            grid-template-columns: repeat(3, 36px);
            grid-template-rows: repeat(2, 36px);
            gap: 4px;
            z-index: 10;
        }

        .dpad-btn {
            background: rgba(45, 38, 59, 0.85);
            color: #f3f0ea;
            border: 2px solid #7c3aed;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .dpad-btn:active {
            background: #7c3aed;
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }

        .message-box {
            margin-top: 12px;
            width: 100%;
            max-width: 520px;
            min-height: 85px;
            background: #2d263b;
            border: 2px solid #5d5070;
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .message-box p {
            font-size: 13px;
            line-height: 1.4;
            color: #e2e8f0;
            transition: opacity 0.15s ease;
        }

        .action-prompt {
            margin-top: 6px;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hint {
            margin-top: 6px;
            font-size: 10.5px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div class="controls-bar">
            <button class="control-btn" onclick="toggleLights()" id="light-btn">💡 Lights Off</button>
            <button class="control-btn" onclick="resetPosition()">🏠 Center View</button>
        </div>

        <div class="dpad-container">
            <button class="dpad-btn dpad-up" ontouchstart="startMove('w')" ontouchend="stopMove('w')" onmousedown="startMove('w')" onmouseup="stopMove('w')">⬆️</button>
            <button class="dpad-btn dpad-left" ontouchstart="startMove('a')" ontouchend="stopMove('a')" onmousedown="startMove('a')" onmouseup="stopMove('a')">⬅️</button>
            <button class="dpad-btn dpad-down" ontouchstart="startMove('s')" ontouchend="stopMove('s')" onmousedown="startMove('s')" onmouseup="stopMove('s')">⬇️</button>
            <button class="dpad-btn dpad-right" ontouchstart="startMove('d')" ontouchend="stopMove('d')" onmousedown="startMove('d')" onmouseup="stopMove('d')">➡️</button>
        </div>
    </div>

    <div class="message-box">
        <p id="main-text">use WASD or the buttons on screen to walk cuteeee arwa around her whole house explore the rooms and find cuteeee pets hiding in every corner</p>
        <button id="interact-prompt" class="action-prompt" onclick="interactWithNearbyPet()">pet the animal</button>
    </div>
    <div class="hint">✨ walk close to any pet to interact with it cuteeee ✨</div>

    <script>
        let scene, camera, renderer;
        let ambientLight, directionalLight;
        let lightsOn = true;

        // Character variables
        let characterGroup;
        let charPosition = { x: 0, z: 0 };
        let charRotation = 0;
        const charSpeed = 0.055;
        const keys = { w: false, a: false, s: false, d: false };

        // Pets list around the house
        const pets = [
            { x: -3.5, z: -3.5, type: 'dog', name: 'goldie', emoji: '🐶', active: false, msg: "goldie wags its tail happily and gives you a cuteeee warm hug" },
            { x: 3.5, z: -3.5, type: 'cat', name: 'luna', emoji: '🐱', active: false, msg: "luna purrs softly and rubs against your shoes cuteeee kitty cuddles" },
            { x: -3.5, z: 3.5, type: 'bird', name: 'chirpy', emoji: '🐦', active: false, msg: "chirpy sings a cheerful little melody just for you cuteeee feathery friend" },
            { x: 3.5, z: 3.5, type: 'bunny', name: 'hop', emoji: '🐰', active: false, msg: "hop does a tiny little joyful jump right in front of you cuteeee bunny energy" }
        ];
        let activeNearbyPet = null;

        // House boundaries for wall collisions
        const minX = -4.7, maxX = 4.7, minZ = -4.7, maxZ = 4.7;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfbf9);

            // 2. Camera setup (Third person view following character)
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            directionalLight.position.set(6, 10, 6);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 5. Build Whole House & Decor
            buildHouse();

            // 6. Build Character
            buildCharacter();

            // 7. Build Pets
            buildPets();

            // 8. Event listeners for keyboard
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            window.addEventListener('resize', onWindowResize, false);
        }

        function buildHouse() {
            // House Floor with wood planks look
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 0.75 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // House Outer Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf3f0ea, roughness: 0.9 });
            
            // Back Wall
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 5, 0.3), wallMat);
            backWall.position.set(0, 2.5, -5);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 10), wallMat);
            leftWall.position.set(-5, 2.5, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 10), wallMat);
            rightWall.position.set(5, 2.5, 0);
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Front Wall (partial)
            const frontWall1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 0.3), wallMat);
            frontWall1.position.set(-3.25, 2.5, 5);
            scene.add(frontWall1);
            const frontWall2 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 0.3), wallMat);
            frontWall2.position.set(3.25, 2.5, 5);
            scene.add(frontWall2);

            // Interior dividing wall (making multiple rooms)
            const dividerMat = new THREE.MeshStandardMaterial({ color: 0xe6e0d5, roughness: 0.8 });
            const divWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 5, 5), dividerMat);
            divWall.position.set(0, 2.5, -2.5);
            scene.add(divWall);

            // --- DECOR & CARPETS ---
            // Living Room Cozy Rug
            const rugGeo = new THREE.PlaneGeometry(3, 2.5);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.9 });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.01, 2);
            scene.add(rug);

            // Bedroom Bed
            const bedGroup = new THREE.Group();
            const mattress = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.4, 2.8),
                new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.8 })
            );
            mattress.position.set(0, 0.2, 0);
            mattress.castShadow = true;
            bedGroup.add(mattress);
            
            const blanket = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.42, 1.8),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 })
            );
            blanket.position.set(0, 0.22, 0.4);
            bedGroup.add(blanket);
            
            bedGroup.position.set(-3.2, 0, -3.2);
            scene.add(bedGroup);

            // Study Desk & PC Setup in office room
            const desk = new THREE.Mesh(
                new THREE.BoxGeometry(2.2, 0.1, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x4a3b5c })
            );
            desk.position.set(2.8, 1.0, -3.2);
            desk.castShadow = true;
            scene.add(desk);

            const pcScreen = new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 0.6, 0.08),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0x0f172a })
            );
            pcScreen.position.set(2.8, 1.5, -3.3);
            scene.add(pcScreen);
        }

        function buildCharacter() {
            characterGroup = new THREE.Group();

            // Cute Arwa Avatar (Stylized low-poly avatar with hijab / cute outfit)
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.6 }); // Purple hoodie
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), bodyMat);
            body.position.set(0, 0.55, 0);
            body.castShadow = true;
            characterGroup.add(body);

            // Cute Head & Hijab
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.7 }); // Skin / Hijab tone
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), headMat);
            head.position.set(0, 1.05, 0);
            head.castShadow = true;
            characterGroup.add(head);

            // Cute little halo / flower crown accent on head
            const crownMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const crown = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 24), crownMat);
            crown.rotation.x = Math.PI / 2;
            crown.position.set(0, 1.22, 0);
            characterGroup.add(crown);

            characterGroup.position.set(charPosition.x, 0, charPosition.z);
            scene.add(characterGroup);
        }

        function buildPets() {
            pets.forEach(p => {
                const petGroup = new THREE.Group();
                
                const meshMat = new THREE.MeshStandardMaterial({ 
                    color: p.type === 'dog' ? 0xd97706 : p.type === 'cat' ? 0x94a3b8 : p.type === 'bird' ? 0x38bdf8 : 0xf472b6, 
                    roughness: 0.7 
                });
                
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), meshMat);
                body.position.set(0, 0.25, 0);
                body.castShadow = true;
                petGroup.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), meshMat);
                head.position.set(0, 0.52, 0.1);
                head.castShadow = true;
                petGroup.add(head);

                petGroup.position.set(p.x, 0, p.z);
                p.threeObj = petGroup;
                scene.add(petGroup);
            });
        }

        function handleKey(e, isDown) {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = isDown;
            if (k === 'a' || k === 'arrowleft') keys.a = isDown;
            if (k === 's' || k === 'arrowdown') keys.s = isDown;
            if (k === 'd' || k === 'arrowright') keys.d = isDown;
        }

        function startMove(dir) { keys[dir] = true; }
        function stopMove(dir) { keys[dir] = false; }

        function toggleLights() {
            playSound(400, 300);
            lightsOn = !lightsOn;
            const btn = document.getElementById('light-btn');
            const textElement = document.getElementById('main-text');

            if (lightsOn) {
                scene.background.setHex(0xfcfbf9);
                ambientLight.intensity = 0.65;
                directionalLight.intensity = 0.9;
                btn.innerText = "💡 Lights Off";
                textElement.innerText = "lights are back on cozy brightness restored cuteeee";
            } else {
                scene.background.setHex(0x0e0c14);
                ambientLight.intensity = 0.15;
                directionalLight.intensity = 0.2;
                btn.innerText = "💡 Lights On";
                textElement.innerText = "lights are off night ambiance is so peaceful cuteeee";
            }
        }

        function resetPosition() {
            playSound(500, 600);
            charPosition.x = 0;
            charPosition.z = 0;
            document.getElementById('main-text').innerText = "returned to the center of the house cuteeee";
        }

        function playSound(f1, f2) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(f1, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function interactWithNearbyPet() {
            if (!activeNearbyPet) return;
            playSound(600, 900);
            const textElement = document.getElementById('main-text');
            textElement.innerText = `${activeNearbyPet.emoji} ${activeNearbyPet.msg} cuteeee`;
        }

        function updateGame() {
            let moved = false;
            let dx = 0, dz = 0;

            if (keys.w) { dz -= charSpeed; moved = true; }
            if (keys.s) { dz += charSpeed; moved = true; }
            if (keys.a) { dx -= charSpeed; moved = true; }
            if (keys.d) { dx += charSpeed; moved = true; }

            if (moved) {
                let newX = charPosition.x + dx;
                let newZ = charPosition.z + dz;

                // Simple wall collision bounding box check
                if (newX > minX && newX < maxX) charPosition.x = newX;
                if (newZ > minZ && newZ < maxZ) charPosition.z = newZ;

                // Update character rotation towards movement direction
                charRotation = Math.atan2(dx, dz);
                characterGroup.rotation.y = charRotation;
            }

            characterGroup.position.set(charPosition.x, 0, charPosition.z);

            // Smooth third person camera following character from behind and above
            const targetCamX = charPosition.x - Math.sin(charRotation) * 4;
            const targetCamZ = charPosition.z - Math.cos(charRotation) * 4;
            
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (3.5 - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.lookAt(charPosition.x, charPosition.y + 0.8, charPosition.z);

            // Check distance to pets for interaction prompt
            let nearest = null;
            let minDist = 1.4;

            pets.forEach(p => {
                const dist = Math.hypot(charPosition.x - p.x, charPosition.z - p.z);
                if (dist < minDist) {
                    nearest = p;
                }
            });

            const promptBtn = document.getElementById('interact-prompt');
            if (nearest) {
                activeNearbyPet = nearest;
                promptBtn.style.display = 'inline-block';
                promptBtn.innerText = `pet ${nearest.name} ${nearest.emoji} cuteeee`;
            } else {
                activeNearbyPet = null;
                promptBtn.style.display = 'none';
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
